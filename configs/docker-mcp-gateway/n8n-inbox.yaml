# Shared inbox MCP (n8n "Inbox MCP" workflow) as a remote server in the
# `default` profile. Tools are named `inbox_*` so they cannot collide with the
# catalog `n8n` server's tools.
#
# Install:  docker mcp profile server add default \
#             --server file://$PWD/configs/docker-mcp-gateway/n8n-inbox.yaml
# Secret:   the same value as the n8n credential "Inbox MCP token" (Keychain):
#             printf '<token>' | docker mcp secret set n8n-inbox.token
# See configs/n8n/README.md ("inbox-mcp.json") for the full setup, including
# the gateway's remote-URL guard, which may refuse a loopback http URL.
name: n8n-inbox
title: Shared Inbox (n8n)
type: remote
description: Lists the shared inbox targets (bujo, voice, memories) and how to deliver a file to each.
remote:
  # The gateway is a host process, so it reaches the n8n LoadBalancer on
  # loopback directly; never the Cloudflare URL, which Access 302-redirects.
  url: http://localhost:5678/mcp/inbox
  transport_type: streamable-http
  headers:
    Authorization: Bearer ${N8N_INBOX_TOKEN}
secrets:
  - name: n8n-inbox.token
    env: N8N_INBOX_TOKEN
    example: <random 32+ char token>
